<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento Doméstico e Pessoal</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Calibri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.92rem; /* Reduz levemente o tamanho geral da fonte */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 3px 5px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 1.35rem;
            color: var(--text-main);
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #15803d; }

        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }

        .btn-secondary { background: #e2e8f0; color: var(--text-main); }
        .btn-secondary:hover { background: #cbd5e1; }

        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #a16207; }

        .month-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .month-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, input {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        .section-card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 3px 5px -1px rgb(0 0 0 / 0.1);
            padding: 18px;
            margin-bottom: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
        }

        .totals-row {
            font-weight: bold;
            background-color: #f8fafc;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-block;
        }

        .badge-pago { background: #dcfce7; color: #166534; }
        .badge-pendente { background: #fef9c3; color: #854d0e; }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 5px -1px rgb(0 0 0 / 0.1);
            border-left: 4px solid var(--primary);
        }

        .summary-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .summary-card .value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .add-item-form {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--border);
        }

        .add-item-form input, .add-item-form select {
            flex: 1;
            min-width: 120px;
            background: white;
            font-size: 0.85rem;
        }

        .action-btns {
            display: flex;
            gap: 4px;
        }

        @media print {
            body { background: white; padding: 0; }
            .toolbar, .month-controls button, .btn-danger, .add-item-form, header button, .action-btns { display: none !important; }
            .section-card, header, .summary-card { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <header>
        <h1>💼 Orçamento Doméstico e Pessoal</h1>
        <div class="toolbar">
            <button class="btn-success" onclick="adicionarMesPrompt()">➕ Adicionar Mês</button>
            <button class="btn-danger" onclick="excluirMesAtual()">🗑️ Excluir Mês</button>
            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📤 Importar</button>
            <input type="file" id="importFile" style="display:none" onchange="importarJSON(event)">
            <button class="btn-secondary" onclick="exportarJSON()">📥 Exportar JSON</button>
            <button class="btn-primary" onclick="window.print()">🖨️ Exportar PDF</button>
            
        </div>
    </header>

    <div class="month-selector">
        <div class="month-controls">
            <label for="mesSelect"><strong>Mês Atual:</strong></label>
            <select id="mesSelect" onchange="mudarMes(this.value)"></select>
        </div>
        <div id="mesAnoLabel" style="font-weight: 600; color: var(--text-muted);"></div>
    </div>

    <!-- Cards de Resumo -->
    <div class="summary-grid">
        <div class="summary-card" style="border-left-color: #3b82f6;">
            <h3>Total Casa</h3>
            <div class="value" id="totalCasa">R$ 0,00</div>
        </div>
        <div class="summary-card" style="border-left-color: #eab308;">
            <h3>Total Veículo</h3>
            <div class="value" id="totalVeiculo">R$ 0,00</div>
        </div>
        <div class="summary-card" style="border-left-color: #ec4899;">
            <h3>Total Pessoal</h3>
            <div class="value" id="totalPessoal">R$ 0,00</div>
        </div>
        <div class="summary-card" style="border-left-color: #16a34a;">
            <h3>Gasto Geral do Mês</h3>
            <div class="value" id="totalGeral">R$ 0,00</div>
        </div>
    </div>

    <!-- Container das Seções -->
    <div id="secoes-container"></div>
</div>

<script>
    let dadosOrcamento = JSON.parse(localStorage.getItem('orcamento_data')) || {
        "Novembro 2026": {
            casa: [
                { id: 1, item: "Aluguel", obs: "Mensal", data: "2026-11-05", previsto: 1300, pago: 0, status: "Pendente" },
                { id: 2, item: "Luz", obs: "Mensal", data: "2026-11-10", previsto: 200, pago: 0, status: "Pendente" }
            ],
            veiculo: [],
            pessoal: []
        }
    };

    let mesAtual = Object.keys(dadosOrcamento)[0] || "";
    let editando = { categoria: null, index: null };

    const categoriasConfig = [
        { key: 'casa', title: '🏠 Despesas com Casa', placeholderItem: 'Ex: Aluguel, Luz' },
        { key: 'veiculo', title: '🚗 Despesas com Veículo', placeholderItem: 'Ex: Combustível, Óleo' },
        { key: 'pessoal', title: '👤 Despesas Pessoais', placeholderItem: 'Ex: Lazer, Cabelo' }
    ];

    function salvarDados() {
        localStorage.setItem('orcamento_data', JSON.stringify(dadosOrcamento));
    }

    function inicializar() {
        atualizarSelectMeses();
        construirLayoutSecoes();
        carregarDadosMes();
    }

    function construirLayoutSecoes() {
        const container = document.getElementById('secoes-container');
        container.innerHTML = '';

        categoriasConfig.forEach(cat => {
            const isEditing = editando.categoria === cat.key;
            container.innerHTML += `
                <div class="section-card">
                    <div class="section-header">
                        <h2 class="section-title">${cat.title}</h2>
                    </div>
                    <table id="tabela_${cat.key}">
                        <thead>
                            <tr>
                                <th>Item / Categoria</th>
                                <th>Descrição</th>
                                <th>Data Venc.</th>
                                <th>Valor Previsto</th>
                                <th>Valor Pago</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <div class="add-item-form" id="form_${cat.key}">
                        <h4 style="width:100%; margin-bottom: 4px; font-size: 0.85rem; color: ${isEditing ? 'var(--warning)' : 'var(--text-muted)'};">
                            ${isEditing ? '✏️ Editando Item' : '➕ Adicionar Novo Item'}
                        </h4>
                        <input type="text" id="desc_${cat.key}_item" placeholder="${cat.placeholderItem}">
                        <input type="text" id="desc_${cat.key}_obs" placeholder="Descrição opcional">
                        <input type="date" id="desc_${cat.key}_data">
                        <input type="number" step="0.01" id="desc_${cat.key}_prev" placeholder="Previsto (R$)">
                        <input type="number" step="0.01" id="desc_${cat.key}_pago" placeholder="Pago (R$)">
                        <select id="desc_${cat.key}_status">
                            <option value="Pendente">Pendente</option>
                            <option value="Pago">Pago</option>
                        </select>
                        <button class="${isEditing ? 'btn-warning' : 'btn-primary'}" onclick="salvarDespesa('${cat.key}')">
                            ${isEditing ? 'Salvar' : 'Adicionar'}
                        </button>
                        ${isEditing ? `<button class="btn-secondary" onclick="cancelarEdicao('${cat.key}')">Cancelar</button>` : ''}
                    </div>
                </div>
            `;
        });
    }

    function atualizarSelectMeses() {
        const select = document.getElementById('mesSelect');
        select.innerHTML = '';
        Object.keys(dadosOrcamento).forEach(mes => {
            const opt = document.createElement('option');
            opt.value = mes;
            opt.textContent = mes;
            if (mes === mesAtual) opt.selected = true;
            select.appendChild(opt);
        });
        document.getElementById('mesAnoLabel').textContent = `Visualizando: ${mesAtual}`;
    }

    function mudarMes(novoMes) {
        mesAtual = novoMes;
        editando = { categoria: null, index: null };
        atualizarSelectMeses();
        construirLayoutSecoes();
        carregarDadosMes();
    }

    function adicionarMesPrompt() {
        const nomeMes = prompt("Digite o nome e ano do novo mês (ex: Dezembro 2026):");
        if (nomeMes && !dadosOrcamento[nomeMes]) {
            dadosOrcamento[nomeMes] = { casa: [], veiculo: [], pessoal: [] };
            mesAtual = nomeMes;
            editando = { categoria: null, index: null };
            salvarDados();
            atualizarSelectMeses();
            construirLayoutSecoes();
            carregarDadosMes();
        } else if (dadosOrcamento[nomeMes]) {
            alert("Este mês já existe.");
        }
    }

    function excluirMesAtual() {
        if (Object.keys(dadosOrcamento).length <= 1) {
            alert("Você precisa manter pelo menos um mês cadastrado.");
            return;
        }
        if (confirm(`Tem certeza que deseja excluir o mês de ${mesAtual}?`)) {
            delete dadosOrcamento[mesAtual];
            mesAtual = Object.keys(dadosOrcamento)[0];
            editando = { categoria: null, index: null };
            salvarDados();
            atualizarSelectMeses();
            construirLayoutSecoes();
            carregarDadosMes();
        }
    }

    function carregarDadosMes() {
        if (!dadosOrcamento[mesAtual]) return;

        categoriasConfig.forEach(cat => {
            if (dadosOrcamento[mesAtual][cat.key]) {
                dadosOrcamento[mesAtual][cat.key].sort((a, b) => {
                    if (!a.data) return 1;
                    if (!b.data) return -1;
                    return new Date(a.data) - new Date(b.data);
                });
            }
            renderizarTabela(cat.key, dadosOrcamento[mesAtual][cat.key] || []);
        });

        calcularTotais();
    }

    function renderizarTabela(categoria, itens) {
        const tbody = document.querySelector(`#tabela_${categoria} tbody`);
        if (!tbody) return;
        tbody.innerHTML = '';

        let totalPrev = 0;
        let totalPago = 0;

        itens.forEach((el, index) => {
            totalPrev += Number(el.previsto) || 0;
            totalPago += Number(el.pago) || 0;

            let dataFormatada = '-';
            if (el.data) {
                const partes = el.data.split('-');
                if (partes.length === 3) {
                    dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${el.item}</td>
                <td>${el.obs || '-'}</td>
                <td>${dataFormatada}</td>
                <td>R$ ${Number(el.previsto).toFixed(2)}</td>
                <td>R$ ${Number(el.pago).toFixed(2)}</td>
                <td><span class="badge ${el.status === 'Pago' ? 'badge-pago' : 'badge-pendente'}" onclick="alternarStatus('${categoria}', ${index})" title="Clique para alternar status">${el.status}</span></td>
                <td>
                    <div class="action-btns">
                        <button class="btn-warning" style="padding:3px 6px; font-size:0.7rem;" onclick="prepararEdicao('${categoria}', ${index})" title="Editar">✏️</button>
                        <button class="btn-danger" style="padding:3px 6px; font-size:0.7rem;" onclick="removerItem('${categoria}', ${index})" title="Excluir">❌</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        const trTotal = document.createElement('tr');
        trTotal.className = 'totals-row';
        trTotal.innerHTML = `
            <td colspan="3"><strong>Total ${capitalizar(categoria)}</strong></td>
            <td><strong>R$ ${totalPrev.toFixed(2)}</strong></td>
            <td><strong>R$ ${totalPago.toFixed(2)}</strong></td>
            <td colspan="2"></td>
        `;
        tbody.appendChild(trTotal);
    }

    function salvarDespesa(categoria) {
        const itemInput = document.getElementById(`desc_${categoria}_item`);
        const obsInput = document.getElementById(`desc_${categoria}_obs`);
        const dataInput = document.getElementById(`desc_${categoria}_data`);
        const prevInput = document.getElementById(`desc_${categoria}_prev`);
        const pagoInput = document.getElementById(`desc_${categoria}_pago`);
        const statusInput = document.getElementById(`desc_${categoria}_status`);

        if (!itemInput.value) {
            alert("Preencha pelo menos o nome do item.");
            return;
        }

        const dadosItem = {
            id: editando.categoria === categoria && editando.index !== null ? dadosOrcamento[mesAtual][categoria][editando.index].id : Date.now(),
            item: itemInput.value,
            obs: obsInput.value,
            data: dataInput.value,
            previsto: parseFloat(prevInput.value) || 0,
            pago: parseFloat(pagoInput.value) || 0,
            status: statusInput.value
        };

        if (editando.categoria === categoria && editando.index !== null) {
            dadosOrcamento[mesAtual][categoria][editando.index] = dadosItem;
            editando = { categoria: null, index: null };
        } else {
            dadosOrcamento[mesAtual][categoria].push(dadosItem);
        }

        salvarDados();
        construirLayoutSecoes();
        carregarDadosMes();
    }

    function prepararEdicao(categoria, index) {
        const item = dadosOrcamento[mesAtual][categoria][index];
        editando = { categoria, index };
        
        construirLayoutSecoes();

        document.getElementById(`desc_${categoria}_item`).value = item.item;
        document.getElementById(`desc_${categoria}_obs`).value = item.obs || '';
        document.getElementById(`desc_${categoria}_data`).value = item.data || '';
        document.getElementById(`desc_${categoria}_prev`).value = item.previsto;
        document.getElementById(`desc_${categoria}_pago`).value = item.pago;
        document.getElementById(`desc_${categoria}_status`).value = item.status;
        
        document.getElementById(`form_${categoria}`).scrollIntoView({ behavior: 'smooth' });
    }

    function cancelarEdicao(categoria) {
        editando = { categoria: null, index: null };
        construirLayoutSecoes();
        carregarDadosMes();
    }

    function alternarStatus(categoria, index) {
        const item = dadosOrcamento[mesAtual][categoria][index];
        item.status = item.status === 'Pago' ? 'Pendente' : 'Pago';
        salvarDados();
        carregarDadosMes();
    }

    function removerItem(categoria, index) {
        if(editando.categoria === categoria && editando.index === index) {
            editando = { categoria: null, index: null };
        }
        dadosOrcamento[mesAtual][categoria].splice(index, 1);
        salvarDados();
        construirLayoutSecoes();
        carregarDadosMes();
    }

    function calcularTotais() {
        let somas = { casa: 0, veiculo: 0, pessoal: 0 };
        let totalGeral = 0;

        categoriasConfig.forEach(cat => {
            const itens = dadosOrcamento[mesAtual][cat.key] || [];
            itens.forEach(i => {
                const val = Number(i.pago) > 0 ? Number(i.pago) : Number(i.previsto);
                somas[cat.key] += val;
                totalGeral += val;
            });
        });

        document.getElementById('totalCasa').textContent = `R$ ${somas.casa.toFixed(2)}`;
        document.getElementById('totalVeiculo').textContent = `R$ ${somas.veiculo.toFixed(2)}`;
        document.getElementById('totalPessoal').textContent = `R$ ${somas.pessoal.toFixed(2)}`;
        document.getElementById('totalGeral').textContent = `R$ ${totalGeral.toFixed(2)}`;
    }

    function capitalizar(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
    }

    function exportarJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dadosOrcamento, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "orcamento_domestico_pessoal.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importarJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                dadosOrcamento = JSON.parse(e.target.result);
                mesAtual = Object.keys(dadosOrcamento)[0];
                editando = { categoria: null, index: null };
                salvarDados();
                inicializar();
                alert("Dados importados com sucesso!");
            } catch (err) {
                alert("Erro ao ler o arquivo JSON.");
            }
        };
        reader.readAsText(file);
    }

    window.onload = inicializar;
</script>

</body>
</html>
